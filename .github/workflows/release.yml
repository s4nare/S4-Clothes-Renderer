name: release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: |
          $last = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          $lastVersion = if ($last) { [version]$last.Substring(1) } else { [version]'0.0.0' }
          $projectVersion = [version](Select-Xml -Path src/S4ClothesRenderer/S4ClothesRenderer.csproj -XPath '//Version').Node.InnerText
          $version = if ($projectVersion -gt $lastVersion) { $projectVersion } else { [version]"$($lastVersion.Major).$($lastVersion.Minor).$($lastVersion.Build + 1)" }
          "VERSION=$version" >> $env:GITHUB_ENV
          if ($last -and -not (git diff --name-only $last HEAD -- release-notes.md)) { git log --format='- %s' "$last..HEAD" | Out-File notes.md -Encoding utf8 }
          else { Copy-Item release-notes.md notes.md }
      - shell: pwsh
        run: dotnet publish src/S4ClothesRenderer/S4ClothesRenderer.csproj -c Release -o publish/S4ClothesRenderer -p:Version=$env:VERSION
      - shell: pwsh
        run: |
          Copy-Item branding.example.json, README.md, LICENSE publish/S4ClothesRenderer
          Copy-Item fivem/clothes_refs publish/S4ClothesRenderer/clothes_refs -Recurse
          Compress-Archive publish/S4ClothesRenderer/* S4ClothesRenderer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: S4ClothesRenderer
          path: S4ClothesRenderer.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: S4ClothesRenderer.zip
          body_path: notes.md
