name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/S4ClothesRenderer/S4ClothesRenderer.csproj -c Release -o publish/S4ClothesRenderer
      - shell: pwsh
        run: |
          Copy-Item branding.example.json, README.md, LICENSE publish/S4ClothesRenderer
          Copy-Item fivem/clothes_refs publish/S4ClothesRenderer/clothes_refs -Recurse
          Compress-Archive publish/S4ClothesRenderer/* S4ClothesRenderer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: S4ClothesRenderer
          path: S4ClothesRenderer.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: S4ClothesRenderer.zip
          generate_release_notes: true
